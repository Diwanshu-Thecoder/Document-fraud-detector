<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Intake — Fraud Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2EEE4;
    --paper-dark: #E8E1D0;
    --ink: #23241F;
    --ink-soft: #5B5A50;
    --stamp-amber: #B8863A;
    --stamp-red: #9B3A2E;
    --stamp-green: #3E6B4F;
    --line: #C9C1AC;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  .frame {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 8px;
  }

  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }

  header .case-ref {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .subhead {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 40px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .intake-panel {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }

  .dropzone {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--ink);
    background: rgba(184, 134, 58, 0.06);
  }

  .dropzone .icon {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .dropzone .label {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .dropzone .sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  #fileInput { display: none; }

  .case-file {
    display: none;
    margin-top: 32px;
    border-top: 1px solid var(--line);
    padding-top: 32px;
  }

  .case-file.active { display: grid; grid-template-columns: 1fr 260px; gap: 28px; }

  .doc-preview {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
  }

  .doc-preview img { max-width: 100%; max-height: 320px; display: block; }

  .doc-meta {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .meta-row {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .meta-row .k {
    color: var(--ink-soft);
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 10px;
    margin-bottom: 2px;
  }

  .meta-row .v {
    color: var(--ink);
    word-break: break-all;
  }

  .stamp {
    align-self: flex-start;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
    border: 2.5px solid var(--stamp-amber);
    color: var(--stamp-amber);
    border-radius: var(--radius);
    transform: rotate(-3deg);
    display: inline-block;
    position: relative;
  }

  .stamp::after {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid var(--stamp-amber);
    border-radius: 2px;
    opacity: 0.5;
  }

  footer {
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .error-banner {
    display: none;
    background: rgba(155, 58, 46, 0.1);
    border: 1px solid var(--stamp-red);
    color: var(--stamp-red);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="frame">
    <header>
      <h1>Document Intake</h1>
      <span class="case-ref" id="clock"></span>
    </header>
    <div class="subhead">Phase 1 — upload &amp; preview. Forgery analysis arrives in Phase 2.</div>

    <div class="intake-panel">
      <div class="dropzone" id="dropzone">
        <div class="icon">&#9633;</div>
        <div class="label">Drop a document here, or click to select</div>
        <div class="sub">JPG, PNG, or PDF — certificates, transcripts, ID proofs</div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" />
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="case-file" id="caseFile">
        <div class="doc-preview" id="docPreview"></div>
        <div class="doc-meta">
          <div class="meta-row"><span class="k">Case ID</span><span class="v" id="metaId">—</span></div>
          <div class="meta-row"><span class="k">Filename</span><span class="v" id="metaName">—</span></div>
          <div class="meta-row"><span class="k">Size</span><span class="v" id="metaSize">—</span></div>
          <div class="meta-row"><span class="k">Received</span><span class="v" id="metaTime">—</span></div>
          <div class="stamp" id="metaStatus">Pending</div>
        </div>
      </div>
    </div>

    <footer>Document Fraud Detection API &middot; localhost:8000</footer>
  </div>

<script>
  const API_BASE = "http://localhost:8000";

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const caseFile = document.getElementById('caseFile');
  const errorBanner = document.getElementById('errorBanner');
  const docPreview = document.getElementById('docPreview');

  document.getElementById('clock').textContent = new Date().toISOString().slice(0,10);

  dropzone.addEventListener('click', () => fileInput.click());

  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, e => e.preventDefault());
  });
  dropzone.addEventListener('dragover', () => dropzone.classList.add('dragover'));
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
  }

  async function handleFile(file) {
    errorBanner.style.display = 'none';
    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch(`${API_BASE}/api/documents/upload`, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        const err = await res.json();
        showError(err.detail || 'Upload failed');
        return;
      }
      const data = await res.json();
      renderCaseFile(data, file);
    } catch (err) {
      showError('Could not reach the API. Is the backend running on localhost:8000?');
    }
  }

  function renderCaseFile(data, file) {
    caseFile.classList.add('active');

    if (file.type.startsWith('image/')) {
      docPreview.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="preview" />`;
    } else {
      docPreview.innerHTML = `<div style="font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);">PDF uploaded — preview rendering comes in a later phase</div>`;
    }

    document.getElementById('metaId').textContent = data.id;
    document.getElementById('metaName').textContent = data.original_filename;
    document.getElementById('metaSize').textContent = `${(data.size_bytes / 1024).toFixed(1)} KB`;
    document.getElementById('metaTime').textContent = data.uploaded_at.replace('T', ' ').slice(0, 19) + ' UTC';
    document.getElementById('metaStatus').textContent = data.status;
  }
</script>
</body>
</html>
